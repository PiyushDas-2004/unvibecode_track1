# Example GitHub Actions workflow for unvibecode-mapfile (community prototype).
# Not executed on GitHub as part of this submission; each command in it was run locally (see ../../examples).
name: UnvibeCode
on:
  pull_request:
permissions:
  contents: read
  checks: write        # to publish the one-line "UnvibeCode" check shown in the PR's checks list
jobs:
  unvibecode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade unvibecode "unvibecode-mapfile @ git+https://github.com/PiyushDas-2004/unvibecode@claude/unvibecode-track2-adoption-yqgmiv#subdirectory=prototype"
      # 1. Business reach of this PR from the committed UNVIBECODE.md. Local only: no upload, no LLM.
      - id: reach
        run: |
          echo "title=$(unvibe --base origin/${{ github.base_ref }} --head HEAD --oneline)" >> "$GITHUB_OUTPUT"
          unvibe --base "origin/${{ github.base_ref }}" --head HEAD --markdown > reach.md
          cat reach.md >> "$GITHUB_STEP_SUMMARY"
      # 2. Freeze check. Uploads to the hosted UnvibeCode service ONLY if an import line changed. Warn-only.
      - run: unvibecode-mapfile check --since "origin/${{ github.base_ref }}" --markdown >> "$GITHUB_STEP_SUMMARY"
      # 3. Visible, quiet brand surface: one check run whose title is the reach line (no PR comment).
      - uses: actions/github-script@v7
        env:
          TITLE: ${{ steps.reach.outputs.title }}
        with:
          script: |
            const fs = require('fs');
            await github.rest.checks.create({
              owner: context.repo.owner, repo: context.repo.repo,
              name: 'UnvibeCode', head_sha: context.payload.pull_request.head.sha,
              status: 'completed', conclusion: 'neutral',
              output: { title: process.env.TITLE.slice(0, 250), summary: fs.readFileSync('reach.md', 'utf8') }
            });
